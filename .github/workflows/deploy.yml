name: Deploy to Baota Server

on:
  push:
    branches:
      - main # 推送到 main 分支时自动触发
  workflow_dispatch: # 支持在 GitHub 界面手动点击触发部署按钮！

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. 安装依赖并构建打包
        run: |
          npm install
          npm run build

      - name: 4. 通过 SCP 上传静态构建成果 (dist) 到宝塔服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "dist/*"
          target: "${{ secrets.SERVER_TARGET_DIR || '/www/wwwroot/your-site' }}"
          strip_components: 1

      - name: 5. 远程连接服务器并用 PM2 管理/重启服务 (如为 Node/SPA 静态托管)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "部署完成！"
